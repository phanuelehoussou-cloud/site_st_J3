<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>Mes projets</title>

<body> 
    <section class="hero" id="projets">
        <div class="container py-5">

            <div id="projetsCarousel" class="carousel slide" data-bs-ride="carousel">

                <div class="carousel-indicators">
                    <button type="button" data-bs-target="#projetsCarousel" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Slide 1"></button>
                    <button type="button" data-bs-target="#projetsCarousel" data-bs-slide-to="1" aria-label="Slide 2"></button>
                    <button type="button" data-bs-target="#projetsCarousel" data-bs-slide-to="2" aria-label="Slide 3"></button>
                    <button type="button" data-bs-target="#projetsCarousel" data-bs-slide-to="3" aria-label="Slide 4"></button>
                </div>

                <div class="carousel-inner rounded">

                    <!-- Slide 1 -->
                    <div class="carousel-item active">
                        <img src="IMG/Capture d'écran 2026-07-30 221120.png" class="d-block w-100 carousel-image" alt="EDU.AI">
                        <div class="carousel-caption d-none d-md-block">
                            <h5 class="a">APP WEB</h5>
                        </div>
                    </div>

                    <!-- Slide 2 -->
                    <div class="carousel-item">
                        <img src="IMG/Capture d'écran 2026-07-30 225346.png" class="d-block w-100 carousel-image" alt="Gestion de stock">
                        <div class="carousel-caption d-none d-md-block">
                            <h5 class="a">Site Web</h5>
                        </div>
                    </div>

                    <!-- Slide 3 -->
                    <div class="carousel-item">
                        <img src="IMG/Gemini_Generated_Image_hx9ve9hx9ve9hx9v.png" class="d-block w-100 carousel-image" alt="Restaurant">
                        <div class="carousel-caption d-none d-md-block">
                            <h5 class="a">Mon IA perso</h5>
                        </div>
                    </div>

                <button class="carousel-control-prev" type="button" data-bs-target="#projetsCarousel" data-bs-slide="prev">
                    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Précédent</span>
                </button>
                <button class="carousel-control-next" type="button" data-bs-target="#projetsCarousel" data-bs-slide="next">
                    <span class="carousel-control-next-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Suivant</span>
                </button>
            </div>
        </div>
        <div class="hero-buttons mt-4 text-center">
            <a href="index.html" class="btn btn-outline-light btn-lg">Revenir à la page d'accueil</a>
