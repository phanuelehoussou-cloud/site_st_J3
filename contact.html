<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>Contact</title>
</head>
<body>

    <section class="py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-12 col-md-8 col-lg-6">

                    <h1 class="text-center mb-4">Contactez-nous</h1>

                    <form id="contactForm" novalidate>

                        <!-- Nom -->
                        <div class="mb-3">
                            <label for="nom" class="form-label">Nom</label>
                            <input type="text" class="form-control" id="nom" name="nom" required minlength="2">
                            <div class="valid-feedback">Parfait !</div>
                            <div class="invalid-feedback">Merci d'entrer votre nom (2 caractères minimum).</div>
                        </div>

                        <!-- Email -->
                        <div class="mb-3">
                            <label for="email" class="form-label">Email</label>
                            <input type="email" class="form-control" id="email" name="email" required>
                            <div class="valid-feedback">Parfait !</div>
                            <div class="invalid-feedback">Merci d'entrer une adresse email valide.</div>
                        </div>

                        <!-- Message -->
                        <div class="mb-3">
                            <label for="message" class="form-label">Message</label>
                            <textarea class="form-control" id="message" name="message" rows="5" required minlength="10"></textarea>
                            <div class="valid-feedback">Parfait !</div>
                            <div class="invalid-feedback">Votre message doit contenir au moins 10 caractères.</div>
                        </div>

                        <div class="hero-buttons mt-4 text-center">
                            <button type="submit" class="btn btn-orange w-100" style="background-color: #62371f;">Envoyer</button>
                            <a href="index.html" class="btn btn-outline-light btn-lg">Revenir à la page d'accueil</a>
                        </div>                        

                        <div id="successMsg" class="alert alert-success mt-3 d-none">
                            ✅ Message envoyé avec succès ! (simulation)
                        </div>

                    </form>

                </div>
            </div>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const form = document.getElementById("contactForm");
        const nom = document.getElementById("nom");
        const email = document.getElementById("email");
        const message = document.getElementById("message");
        const successMsg = document.getElementById("successMsg");

        function validateField(field, isValid) {
            field.classList.remove("is-valid", "is-invalid");
            field.classList.add(isValid ? "is-valid" : "is-invalid");
        }

        function checkNom() {
            const valid = nom.value.trim().length >= 2;
            validateField(nom, valid);
            return valid;
        }

        function checkEmail() {
            const valid = email.checkValidity() && email.value.trim() !== "";
            validateField(email, valid);
            return valid;
        }

        function checkMessage() {
            const valid = message.value.trim().length >= 10;
            validateField(message, valid);
            return valid;
        }

        // Validation en direct pendant la saisie
        nom.addEventListener("input", checkNom);
        email.addEventListener("input", checkEmail);
        message.addEventListener("input", checkMessage);

        form.addEventListener("submit", (e) => {
            e.preventDefault();

            const nomValid = checkNom();
            const emailValid = checkEmail();
            const messageValid = checkMessage();

            if (nomValid && emailValid && messageValid) {
                successMsg.classList.remove("d-none");
                form.reset();
                // Retire les classes is-valid après reset
                [nom, email, message].forEach(f => f.classList.remove("is-valid", "is-invalid"));
            } else {
                successMsg.classList.add("d-none");
            }
        });
    </script>
</body>
</html>
